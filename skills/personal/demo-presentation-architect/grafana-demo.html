  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1f213d8c-22b6-4e28-9092-daadb1da2403\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ea11fb09-4c31-4f61-8d38-f9c7fc67d017\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"9aa7103f-080f-4011-a277-17640f5697cd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- Typography ---------- */\n  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --font-mono: 'Geist Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;\n\n  --fs-xs: 0.75rem;    /* 12 */\n  --fs-sm: 0.875rem;   /* 14 */\n  --fs-base: 1rem;     /* 16 */\n  --fs-lg: 1.125rem;   /* 18 */\n  --fs-xl: 1.25rem;    /* 20 */\n  --fs-2xl: 1.5rem;    /* 24 */\n  --fs-3xl: 1.875rem;  /* 30 */\n  --fs-4xl: 2.25rem;   /* 36 */\n  --fs-5xl: 3rem;      /* 48 */\n\n  --fw-regular: 400;\n  --fw-medium: 500;\n  --fw-semibold: 600;\n  --fw-bold: 700;\n\n  --lh-tight: 1.2;\n  --lh-heading: 1.3;\n  --lh-normal: 1.5;\n  --lh-relaxed: 1.7;\n\n  /* ---------- Radii ---------- */\n  --radius: 0.75rem;                      /* 12 */\n  --radius-sm: calc(var(--radius) - 4px); /* 8  */\n  --radius-md: calc(var(--radius) - 2px); /* 10 */\n  --radius-lg: var(--radius);             /* 12 */\n  --radius-xl: 1rem;                      /* 16 */\n  --radius-2xl: 1rem;\n  --radius-full: 9999px;\n\n  /* ---------- Spacing scale (4-pt) ---------- */\n  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;\n  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;\n  --space-12: 3rem;  --space-16: 4rem;\n\n  /* =====================================================================\n     LIGHT THEME — Cyan industrial-primary\n     HSL channel values only (wrap in hsl(var(--x)) when using).\n     ===================================================================== */\n  --color-background:          0 0% 100%;\n  --color-foreground:          222.2 84% 4.9%;\n  --color-card:                0 0% 100%;\n  --color-card-foreground:     222.2 84% 4.9%;\n  --color-popover:             0 0% 100%;\n  --color-popover-foreground:  222.2 84% 4.9%;\n\n  --color-primary:             200 80% 57%;   /* cyan */\n  --color-primary-foreground:  210 40% 98%;\n\n  --color-secondary:           210 40% 96%;\n  --color-secondary-foreground:222.2 84% 4.9%;\n\n  --color-muted:               210 40% 96%;\n  --color-muted-foreground:    215.4 16.3% 46.9%;\n\n  --color-accent:              32 95% 65%;   /* warm orange */\n  --color-accent-foreground:   222.2 84% 4.9%;\n\n  --color-destructive:         0 84% 60%;\n  --color-destructive-foreground: 210 40% 98%;\n\n  --color-border:              214.3 31.8% 91.4%;\n  --color-input:               214.3 31.8% 91.4%;\n  --color-ring:                200 80% 57%;\n\n  /* Industrial / brand extended */\n  --color-industrial-primary:  200 80% 57%;  /* cyan */\n  --color-industrial-secondary:30 100% 60%;  /* golden orange */\n  --color-industrial-accent:   32 95% 65%;\n  --color-tech-blue:           200 80% 57%;\n  --color-tech-purple:         252 83% 57%;\n  --color-steel-gray:          215 25% 27%;\n\n  /* Sidebar */\n  --color-sidebar-background:  0 0% 98%;\n  --color-sidebar-foreground:  222.2 84% 4.9%;\n  --color-sidebar-primary:     200 80% 57%;\n  --color-sidebar-primary-foreground: 210 40% 98%;\n  --color-sidebar-accent:      32 95% 90%;\n  --color-sidebar-accent-foreground: 222.2 84% 4.9%;\n  --color-sidebar-border:      214.3 31.8% 91.4%;\n  --color-sidebar-ring:        200 80% 57%;\n\n  /* Gradients */\n  --gradient-hero:   linear-gradient(135deg, hsl(200 80% 57%), hsl(200 80% 47%));\n  --gradient-card:   linear-gradient(180deg, hsl(0 0% 100%), hsl(210 40% 98%));\n  --gradient-accent: linear-gradient(135deg, hsl(200 80% 57%), hsl(32 95% 65%));\n\n  /* Shadows */\n  --shadow-soft:   0 10px 30px -10px hsl(222.2 84% 4.9% / 0.10);\n  --shadow-strong: 0 0 30px hsl(200 80% 57% / 0.15);\n  --shadow-sm:     0 1px 2px 0 hsl(222 84% 4.9% / 0.05);\n  --shadow-md:     0 4px 6px -1px hsl(222 84% 4.9% / 0.10), 0 2px 4px -2px hsl(222 84% 4.9% / 0.08);\n  --shadow-lg:     0 10px 15px -3px hsl(222 84% 4.9% / 0.10), 0 4px 6px -4px hsl(222 84% 4.9% / 0.08);\n\n  /* Motion */\n  --ease-smooth:   cubic-bezier(0.4, 0, 0.2, 1);\n  --transition-smooth: all 0.3s var(--ease-smooth);\n}\n\n/* =====================================================================\n   DARK THEME — Orange industrial-primary\n   ===================================================================== */\n.dark {\n  --color-background:          222 47% 11%;\n  --color-foreground:          213 31% 91%;\n  --color-card:                222 47% 13%;\n  --color-card-foreground:     213 31% 91%;\n  --color-popover:             222 47% 13%;\n  --color-popover-foreground:  213 31% 91%;\n\n  --color-primary:             25 95% 53%;   /* orange swap */\n  --color-primary-foreground:  222 47% 11%;\n\n  --color-secondary:           222 47% 16%;\n  --color-secondary-foreground:213 31% 91%;\n\n  --color-muted:               222 47% 16%;\n  --color-muted-foreground:    215 20% 65%;\n\n  --color-accent:              32 81% 60%;\n  --color-accent-foreground:   222 47% 11%;\n\n  --color-destructive:         0 84% 60%;\n  --color-destructive-foreground: 210 40% 98%;\n\n  --color-border:              222 47% 20%;\n  --color-input:               222 47% 16%;\n  --color-ring:                25 95% 53%;\n\n  --color-industrial-primary:   25 95% 53%;  /* orange */\n  --color-industrial-secondary: 200 80% 57%; /* cyan (swapped) */\n  --color-industrial-accent:    32 81% 60%;\n\n  --color-sidebar-background:  222 47% 9%;\n  --color-sidebar-foreground:  213 31% 91%;\n  --color-sidebar-primary:     25 95% 53%;\n  --color-sidebar-primary-foreground: 222 47% 11%;\n  --color-sidebar-accent:      222 47% 14%;\n  --color-sidebar-accent-foreground: 213 31% 91%;\n  --color-sidebar-border:      222 47% 18%;\n  --color-sidebar-ring:        25 95% 53%;\n\n  --gradient-hero:   linear-gradient(135deg, hsl(25 95% 53%), hsl(32 81% 60%));\n  --gradient-card:   linear-gradient(180deg, hsl(222 47% 13%), hsl(222 47% 11%));\n  --gradient-accent: linear-gradient(135deg, hsl(25 95% 53%), hsl(32 81% 60%));\n\n  --shadow-soft:   0 10px 30px -10px hsl(222 47% 4% / 0.8);\n  --shadow-strong: 0 0 30px hsl(25 95% 53% / 0.20);\n}\n\n/* =====================================================================\n   SEMANTIC BASE STYLES\n   ===================================================================== */\nhtml, body {\n  font-family: var(--font-sans);\n  color: hsl(var(--color-foreground));\n  background: hsl(var(--color-background));\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  font-feature-settings: \"ss01\", \"cv11\";\n}\n\nh1, .h1 { font-size: var(--fs-3xl); font-weight: var(--fw-semibold); line-height: var(--lh-heading); letter-spacing: -0.01em; }\nh2, .h2 { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); line-height: var(--lh-heading); letter-spacing: -0.005em; }\nh3, .h3 { font-size: var(--fs-xl);  font-weight: var(--fw-semibold); line-height: var(--lh-heading); }\nh4, .h4 { font-size: var(--fs-lg);  font-weight: var(--fw-semibold); line-height: var(--lh-heading); }\nh5, .h5 { font-size: var(--fs-base);font-weight: var(--fw-semibold); line-height: var(--lh-heading); }\nh6, .h6 { font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: var(--lh-heading); }\n\np, .p   { font-size: var(--fs-base); line-height: var(--lh-relaxed); }\n.small  { font-size: var(--fs-sm); color: hsl(var(--color-muted-foreground)); }\n.xsmall { font-size: var(--fs-xs); color: hsl(var(--color-muted-foreground)); }\n\ncode, .code {\n  font-family: var(--font-mono);\n  font-size: var(--fs-sm);\n  background: hsl(var(--color-muted));\n  color: hsl(var(--color-primary));\n  padding: 0.125rem 0.25rem;\n  border-radius: 0.25rem;\n}\n\n/* ---------- Handy helpers (used by preview cards) ---------- */\n.ip-bg   { background: hsl(var(--color-industrial-primary)); }\n.ip-fg   { color: hsl(var(--color-industrial-primary)); }\n.ip-bd   { border-color: hsl(var(--color-industrial-primary)); }\n.surface { background: hsl(var(--color-card)); color: hsl(var(--color-card-foreground)); border: 1px solid hsl(var(--color-border)); }\n.muted   { color: hsl(var(--color-muted-foreground)); }\n\n.focus-ring:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 2px hsl(var(--color-background)), 0 0 0 4px hsl(var(--color-ring));\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PlantTalk Datacenter Demo — slide styles\n   Built on PlantTalk design system (dark, industrial-orange).\n   ============================================================ */\n\n:root {\n  /* type scale @ 1920×1080 */\n  --type-display:   120px;\n  --type-hero:      96px;\n  --type-title:     64px;\n  --type-subtitle:  44px;\n  --type-eyebrow:   24px;\n  --type-body:      28px;\n  --type-body-lg:   32px;\n  --type-small:     22px;\n  --type-mono:      22px;\n  --type-mono-sm:   20px;\n\n  --pad-x:     96px;\n  --pad-y:     80px;\n  --pad-bottom:80px;\n  --gap-title: 40px;\n  --gap-item:  24px;\n  --gap-card:  32px;\n\n  /* surfaces (dark only — control rooms) */\n  --bg:        hsl(222 47% 9%);\n  --bg-alt:    hsl(222 47% 11%);\n  --surface:   hsl(222 47% 13%);\n  --surface-2: hsl(222 47% 16%);\n  --line:      hsl(222 47% 20%);\n  --line-soft: hsl(222 47% 17%);\n  --fg:        hsl(213 31% 91%);\n  --fg-mute:   hsl(215 20% 65%);\n  --fg-dim:    hsl(215 16% 50%);\n\n  --brand:        hsl(25 95% 53%);   /* industrial-primary, orange */\n  --brand-soft:   hsl(25 95% 53% / .15);\n  --brand-line:   hsl(25 95% 53% / .35);\n  --brand-glow:   0 0 60px hsl(25 95% 53% / .25);\n  --accent-cyan:  hsl(200 80% 57%);  /* swapped secondary */\n\n  --ok:    hsl(142 70% 45%);\n  --warn:  hsl(38 95% 55%);\n  --err:   hsl(0 78% 60%);\n}\n\ndeck-stage {\n  font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;\n  background: #000;\n  color: var(--fg);\n}\n\ndeck-stage > section {\n  background: var(--bg);\n  color: var(--fg);\n  font-size: var(--type-body);\n  line-height: 1.5;\n  overflow: hidden;\n  position: relative;\n}\n\n/* ---------- shared frame ---------- */\n.frame {\n  position: absolute;\n  inset: 0;\n  padding: var(--pad-y) var(--pad-x) var(--pad-bottom);\n  display: flex;\n  flex-direction: column;\n}\n\n.eyebrow {\n  font-family: 'Geist Mono', monospace;\n  font-size: var(--type-eyebrow);\n  letter-spacing: 0.32em;\n  text-transform: uppercase;\n  color: var(--brand);\n  font-weight: 500;\n}\n\n.eyebrow.muted { color: var(--fg-mute); }\n\n.slide-title {\n  font-size: var(--type-title);\n  font-weight: 600;\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n  color: var(--fg);\n  text-wrap: balance;\n}\n\n.slide-title em {\n  font-style: normal;\n  color: var(--brand);\n}\n\n.lede {\n  font-size: var(--type-body-lg);\n  line-height: 1.45;\n  color: var(--fg-mute);\n  max-width: 24ch;\n  text-wrap: pretty;\n}\n\n/* ---------- footer / page chrome ---------- */\n.slide-footer {\n  position: absolute;\n  left: var(--pad-x);\n  right: var(--pad-x);\n  bottom: 40px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  font-family: 'Geist Mono', monospace;\n  font-size: var(--type-mono-sm);\n  color: var(--fg-dim);\n  letter-spacing: 0.08em;\n}\n\n.slide-footer .brand-mark {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  color: var(--fg-mute);\n  font-family: 'Geist', sans-serif;\n  letter-spacing: 0;\n}\n\n.brand-mark svg { width: 26px; height: 26px; color: var(--brand); }\n\n.slide-footer .nav-step { color: var(--brand); }\n\n/* ============================================================\n   01 · TITLE\n   ============================================================ */\n.title-slide {\n  background:\n    radial-gradient(ellipse at 80% 30%, hsl(25 95% 53% / .12), transparent 55%),\n    radial-gradient(ellipse at 15% 90%, hsl(200 80% 57% / .08), transparent 60%),\n    var(--bg);\n}\n\n.title-slide .frame {\n  justify-content: center;\n}\n\n.title-mark {\n  display: flex;\n  align-items: center;\n  gap: 28px;\n  margin-bottom: 56px;\n}\n.title-mark .leaf { width: 64px; height: 64px; color: var(--brand); }\n.title-mark .word { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; }\n\n.title-hero {\n  font-size: var(--type-display);\n  font-weight: 600;\n  line-height: 0.98;\n  letter-spacing: -0.035em;\n  text-wrap: balance;\n  max-width: 18ch;\n}\n.title-hero .accent { color: var(--brand); }\n\n.title-sub {\n  margin-top: 48px;\n  max-width: 56ch;\n  font-size: 32px;\n  line-height: 1.5;\n  color: var(--fg-mute);\n  text-wrap: pretty;\n}\n\n.title-meta {\n  position: absolute;\n  left: var(--pad-x);\n  bottom: var(--pad-bottom);\n  display: flex;\n  gap: 64px;\n  font-family: 'Geist Mono', monospace;\n  font-size: var(--type-mono-sm);\n  color: var(--fg-dim);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n}\n.title-meta b { color: var(--fg); font-weight: 500; }\n\n/* ============================================================\n   02 · PROBLEM (3 columns)\n   ============================================================ */\n.problem-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: var(--gap-card);\n  margin-top: 64px;\n}\n.problem-card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 40px;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n}\n.problem-card .pico {\n  width: 56px; height: 56px;\n  display: grid; place-items: center;\n  background: var(--brand-soft);\n  color: var(--brand);\n  border-radius: 10px;\n}\n.problem-card h3 {\n  font-size: 30px;\n  font-weight: 600;\n  line-height: 1.2;\n  letter-spacing: -0.01em;\n  color: var(--fg);\n}\n.problem-card p {\n  font-size: var(--type-body);\n  line-height: 1.55;\n  color: var(--fg-mute);\n}\n\n.problem-head {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  align-items: end;\n  gap: 64px;\n}\n.problem-head .num {\n  font-family: 'Geist Mono', monospace;\n  font-size: 200px;\n  line-height: 0.85;\n  font-weight: 500;\n  color: var(--brand);\n  letter-spacing: -0.05em;\n}\n\n/* ============================================================\n   03 · SOLUTION\n   ============================================================ */\n.solution-grid {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 80px;\n  margin-top: 56px;\n  flex: 1;\n  align-items: start;\n}\n.solution-list {\n  display: flex; flex-direction: column;\n  gap: 18px;\n  margin-top: 16px;\n}\n.solution-list li {\n  display: flex; align-items: flex-start; gap: 16px;\n  font-size: var(--type-body);\n  color: var(--fg);\n  list-style: none;\n}\n.solution-list li::before {\n  content: '';\n  flex: 0 0 8px;\n  width: 8px; height: 8px; margin-top: 14px;\n  background: var(--brand);\n  border-radius: 2px;\n}\n.solution-list li b { color: var(--fg); font-weight: 500; }\n.solution-list li span { color: var(--fg-mute); }\n\n.agent-cards {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 20px;\n}\n.agent-card {\n  padding: 28px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  display: flex; flex-direction: column;\n  gap: 12px;\n  min-height: 200px;\n}\n.agent-card .a-ico {\n  width: 44px; height: 44px;\n  display: grid; place-items: center;\n  background: var(--brand-soft);\n  color: var(--brand);\n  border-radius: 8px;\n  margin-bottom: 4px;\n}\n.agent-card.more { background: transparent; border-style: dashed; }\n.agent-card.more .a-ico { background: transparent; border: 1px dashed var(--brand-line); }\n.agent-card h4 { font-size: 22px; font-weight: 600; color: var(--fg); }\n.agent-card p { font-size: 18px; line-height: 1.5; color: var(--fg-mute); }\n\n/* ============================================================\n   04 · ECOSYSTEM\n   ============================================================ */\n.eco-stage {\n  flex: 1;\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 48px;\n  margin-top: 56px;\n  align-items: stretch;\n  position: relative;\n}\n.eco-card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  padding: 36px;\n  display: flex; flex-direction: column;\n  gap: 18px;\n  position: relative;\n}\n.eco-card.center {\n  background: linear-gradient(180deg, hsl(25 95% 53% / .10), hsl(25 95% 53% / .03));\n  border-color: var(--brand-line);\n  box-shadow: var(--brand-glow);\n}\n.eco-card .e-tag {\n  font-family: 'Geist Mono', monospace;\n  font-size: 18px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--fg-dim);\n}\n.eco-card.center .e-tag { color: var(--brand); }\n.eco-card h3 {\n  font-size: 30px; font-weight: 600;\n  letter-spacing: -0.01em;\n  color: var(--fg);\n}\n.eco-card p { font-size: 19px; line-height: 1.55; color: var(--fg-mute); }\n.eco-card .e-tags {\n  margin-top: auto;\n  display: flex; flex-direction: column; gap: 8px;\n  font-family: 'Geist Mono', monospace;\n  font-size: 16px;\n  color: var(--fg-mute);\n  padding-top: 16px;\n  border-top: 1px solid var(--line-soft);\n}\n.eco-arrow {\n  position: absolute;\n  top: 50%;\n  width: 48px; height: 2px;\n  background: var(--brand-line);\n  transform: translateY(-50%);\n}\n.eco-arrow::after {\n  content: ''; position: absolute; right: -6px; top: -5px;\n  width: 0; height: 0; border-left: 8px solid var(--brand);\n  border-top: 6px solid transparent; border-bottom: 6px solid transparent;\n}\n.eco-arrow.a1 { left: calc(33.333% + 16px); transform: translate(-50%, -50%); }\n.eco-arrow.a2 { left: calc(66.666% + 16px); transform: translate(-50%, -50%); }\n\n.eco-arrow-label {\n  position: absolute;\n  top: 50%; transform: translate(-50%, -36px);\n  font-family: 'Geist Mono', monospace;\n  font-size: 15px; letter-spacing: 0.10em;\n  color: var(--fg-dim); text-transform: uppercase;\n  white-space: nowrap;\n}\n.eco-arrow-label.l1 { left: calc(33.333% + 16px); }\n.eco-arrow-label.l2 { left: calc(66.666% + 16px); }\n\n/* ============================================================\n   05 · INTEGRATIONS\n   ============================================================ */\n.int-grid {\n  margin-top: 56px;\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 18px;\n}\n.int-tile {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 26px 22px;\n  display: flex; flex-direction: column; gap: 10px;\n  min-height: 150px;\n  justify-content: space-between;\n}\n.int-tile .t-name {\n  font-size: 22px; font-weight: 600;\n  color: var(--fg); letter-spacing: -0.005em;\n}\n.int-tile .t-meta {\n  font-family: 'Geist Mono', monospace;\n  font-size: 15px;\n  color: var(--fg-dim);\n  letter-spacing: 0.04em;\n}\n.int-tile .t-ico {\n  width: 36px; height: 36px;\n  color: var(--brand);\n}\n\n.nginx-callout {\n  margin-top: 36px;\n  background: linear-gradient(135deg, hsl(25 95% 53% / .08), transparent 70%);\n  border: 1px solid var(--brand-line);\n  border-radius: 14px;\n  padding: 32px 36px;\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: 32px;\n  align-items: start;\n}\n.nginx-callout .nc-mark {\n  font-family: 'Geist Mono', monospace;\n  font-size: 28px; font-weight: 600;\n  color: var(--brand);\n  letter-spacing: 0.06em;\n  padding: 10px 18px;\n  border: 1px solid var(--brand-line);\n  border-radius: 8px;\n  background: var(--bg);\n}\n.nginx-callout h4 { font-size: 24px; font-weight: 600; color: var(--fg); margin-bottom: 8px; }\n.nginx-callout p { font-size: 20px; line-height: 1.55; color: var(--fg-mute); max-width: 90ch; }\n\n/* ============================================================\n   DEMO SLIDES (shared chat mock)\n   ============================================================ */\n.demo-stage {\n  display: grid;\n  grid-template-columns: 1.55fr 1fr;\n  gap: 56px;\n  flex: 1;\n  margin-top: 32px;\n  align-items: stretch;\n  min-height: 0;\n}\n.demo-side {\n  display: flex; flex-direction: column;\n  padding-top: 24px;\n}\n.demo-side .step {\n  font-family: 'Geist Mono', monospace;\n  font-size: 22px;\n  letter-spacing: 0.18em;\n  color: var(--brand);\n  margin-bottom: 20px;\n}\n.demo-side h2 {\n  font-size: 56px;\n  font-weight: 600;\n  line-height: 1.05;\n  letter-spacing: -0.025em;\n  color: var(--fg);\n  text-wrap: balance;\n}\n.demo-side ul {\n  margin-top: 36px;\n  display: flex; flex-direction: column; gap: 18px;\n  list-style: none;\n}\n.demo-side ul li {\n  font-size: 24px;\n  line-height: 1.45;\n  color: var(--fg-mute);\n  padding-left: 28px;\n  position: relative;\n  text-wrap: pretty;\n}\n.demo-side ul li::before {\n  content: '';\n  position: absolute; left: 0; top: 14px;\n  width: 14px; height: 2px; background: var(--brand);\n}\n.demo-side .stack-tags {\n  margin-top: auto;\n  display: flex; flex-wrap: wrap; gap: 10px;\n  padding-top: 32px;\n}\n.demo-side .stack-tags .tag {\n  font-family: 'Geist Mono', monospace;\n  font-size: 16px;\n  padding: 6px 12px;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  color: var(--fg-mute);\n  letter-spacing: 0.04em;\n}\n\n/* ---------- Chat mockup ---------- */\n.chat-mock {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  background: hsl(222 47% 11%);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  overflow: hidden;\n  box-shadow: 0 30px 60px hsl(0 0% 0% / .4), 0 0 0 1px hsl(0 0% 0% / .25);\n  font-size: 14px;\n  height: 100%;\n  min-height: 0;\n}\n\n.chat-side {\n  background: hsl(222 47% 9%);\n  border-right: 1px solid var(--line);\n  display: flex; flex-direction: column;\n  padding: 14px;\n  gap: 12px;\n}\n.chat-side .pt-logo {\n  display: flex; align-items: center; gap: 10px;\n  padding: 6px 6px 12px;\n  border-bottom: 1px solid var(--line-soft);\n}\n.chat-side .pt-logo svg { width: 22px; height: 22px; color: var(--brand); }\n.chat-side .pt-logo span { font-size: 15px; font-weight: 600; }\n\n.chat-side .new-btn {\n  background: var(--brand);\n  color: hsl(222 47% 11%);\n  font-weight: 600;\n  border: 0; border-radius: 8px;\n  padding: 10px 12px;\n  font-size: 13px;\n  display: flex; align-items: center; gap: 8px;\n  cursor: default;\n}\n\n.chat-side .recent-label {\n  font-family: 'Geist Mono', monospace;\n  font-size: 10px;\n  letter-spacing: 0.20em;\n  text-transform: uppercase;\n  color: var(--fg-dim);\n  padding: 8px 6px 2px;\n}\n\n.chat-side .convo {\n  display: flex; align-items: center; justify-content: space-between;\n  font-size: 13px;\n  padding: 8px 10px;\n  border-radius: 8px;\n  color: var(--fg-mute);\n}\n.chat-side .convo.active { background: var(--surface-2); color: var(--fg); }\n.chat-side .convo .t {\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n  flex: 1; padding-right: 8px;\n}\n.chat-side .convo .when { font-size: 11px; color: var(--fg-dim); flex: 0 0 auto; }\n\n.chat-side .user {\n  margin-top: auto;\n  display: flex; align-items: center; gap: 10px;\n  padding: 10px 6px;\n  border-top: 1px solid var(--line-soft);\n}\n.chat-side .user .av {\n  width: 32px; height: 32px; border-radius: 999px;\n  background: var(--brand-soft); color: var(--brand);\n  font-weight: 600; font-size: 12px;\n  display: grid; place-items: center;\n}\n.chat-side .user .meta { font-size: 12px; line-height: 1.3; }\n.chat-side .user .meta b { color: var(--fg); display: block; font-weight: 500; }\n.chat-side .user .meta span { color: var(--fg-dim); font-size: 11px; }\n\n.chat-main {\n  display: flex; flex-direction: column;\n  background: hsl(222 47% 11%);\n  min-width: 0;\n}\n\n.chat-topbar {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 14px 22px;\n  border-bottom: 1px solid var(--line-soft);\n  font-size: 12px;\n  color: var(--fg-mute);\n}\n.chat-topbar .left { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--fg); }\n.chat-topbar .pill { font-family: 'Geist Mono', monospace; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--fg-mute); letter-spacing: 0.06em; }\n.chat-topbar .right { display: flex; gap: 14px; align-items: center; color: var(--fg-dim); font-size: 12px; }\n.chat-topbar .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ok); display: inline-block; }\n\n.chat-thread {\n  flex: 1; min-height: 0;\n  padding: 22px 28px;\n  overflow: hidden;\n  display: flex; flex-direction: column;\n  gap: 14px;\n}\n\n.bubble {\n  max-width: 92%;\n  padding: 12px 16px;\n  border-radius: 12px;\n  font-size: 14px;\n  line-height: 1.45;\n}\n.bubble.user {\n  align-self: flex-end;\n  background: hsl(25 95% 53% / .14);\n  border: 1px solid var(--brand-line);\n  color: var(--fg);\n}\n.bubble.asst {\n  align-self: flex-start;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  color: var(--fg);\n}\n.bubble.asst.lead { display: flex; flex-direction: column; gap: 12px; max-width: 100%; }\n\n.tool-call {\n  font-family: 'Geist Mono', monospace;\n  font-size: 12px;\n  color: var(--fg-mute);\n  display: flex; align-items: center; gap: 8px;\n  padding: 8px 12px;\n  background: hsl(222 47% 9%);\n  border: 1px solid var(--line-soft);\n  border-radius: 8px;\n  align-self: flex-start;\n}\n.tool-call .tk { color: var(--accent-cyan); }\n.tool-call .ok { color: var(--ok); margin-left: auto; }\n\n.chat-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13px;\n  margin-top: 4px;\n}\n.chat-table th {\n  text-align: left;\n  font-weight: 500;\n  font-family: 'Geist Mono', monospace;\n  font-size: 11px;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--fg-dim);\n  padding: 6px 12px 6px 0;\n  border-bottom: 1px solid var(--line-soft);\n}\n.chat-table td {\n  padding: 8px 12px 8px 0;\n  border-bottom: 1px solid var(--line-soft);\n  color: var(--fg);\n  font-family: 'Geist Mono', monospace;\n  font-size: 13px;\n}\n.chat-table td .status-ok   { color: var(--ok); }\n.chat-table td .status-warn { color: var(--warn); }\n.chat-table td .status-err  { color: var(--err); }\n.chat-table td .status-mute { color: var(--fg-dim); }\n\n.chat-composer {\n  margin: 12px 22px 18px;\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  background: hsl(222 47% 9%);\n  padding: 12px 14px;\n  display: flex; flex-direction: column; gap: 10px;\n}\n.chat-composer .ph { color: var(--fg-dim); font-size: 14px; }\n.chat-composer .row {\n  display: flex; align-items: center; justify-content: space-between;\n  font-family: 'Geist Mono', monospace;\n  font-size: 11px;\n  color: var(--fg-dim);\n  letter-spacing: 0.05em;\n}\n.chat-composer .icons { display: flex; gap: 8px; }\n.chat-composer .icons .ic {\n  width: 24px; height: 24px; border-radius: 6px;\n  display: grid; place-items: center;\n  background: var(--surface-2);\n  color: var(--fg-mute);\n}\n.chat-composer .icons .ic.send { background: var(--brand); color: hsl(222 47% 11%); }\n\n/* ============================================================\n   ANOMALIES / DOCS feature slides\n   ============================================================ */\n.feature-grid {\n  display: grid;\n  grid-template-columns: 1fr 1.1fr;\n  gap: 80px;\n  flex: 1;\n  margin-top: 48px;\n  align-items: start;\n}\n\n.feature-bullets {\n  display: flex; flex-direction: column; gap: 16px;\n  margin-top: 40px;\n  list-style: none;\n}\n.feature-bullets li {\n  font-size: 24px;\n  line-height: 1.45;\n  color: var(--fg-mute);\n  display: flex; gap: 14px;\n}\n.feature-bullets li::before {\n  content: '';\n  flex: 0 0 8px;\n  width: 8px; height: 8px; margin-top: 12px;\n  background: var(--brand); border-radius: 999px;\n}\n\n.process-row {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr auto 1fr;\n  align-items: stretch;\n  gap: 0;\n  margin-bottom: 36px;\n}\n.process-step {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 22px;\n  display: flex; flex-direction: column; gap: 12px;\n}\n.process-step .pi {\n  width: 44px; height: 44px;\n  display: grid; place-items: center;\n  background: var(--brand-soft);\n  color: var(--brand);\n  border-radius: 10px;\n}\n.process-step h4 {\n  font-size: 22px; font-weight: 600; color: var(--fg);\n}\n.process-step p {\n  font-size: 16px; line-height: 1.45; color: var(--fg-mute);\n}\n.process-arrow {\n  align-self: center;\n  font-family: 'Geist Mono', monospace;\n  font-size: 22px;\n  color: var(--brand);\n  padding: 0 14px;\n}\n\n.variants-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 16px;\n}\n.variant-card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 20px 22px;\n  display: flex; flex-direction: column; gap: 8px;\n}\n.variant-card .vh {\n  display: flex; align-items: center; gap: 12px;\n}\n.variant-card .vi {\n  width: 32px; height: 32px;\n  display: grid; place-items: center;\n  background: var(--brand-soft); color: var(--brand);\n  border-radius: 8px;\n}\n.variant-card h5 { font-size: 19px; font-weight: 600; color: var(--fg); }\n.variant-card p { font-size: 16px; line-height: 1.45; color: var(--fg-mute); }\n\n/* doc-types list */\n.doc-types {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 16px;\n}\n.doc-types .dt {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 20px 22px;\n}\n.doc-types .dt h5 { font-size: 19px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }\n.doc-types .dt p  { font-size: 16px; color: var(--fg-mute); line-height: 1.4; }\n.doc-types .dt.last { border-style: dashed; }\n\n/* ============================================================\n   14 · CLOSING\n   ============================================================ */\n.close-slide {\n  background:\n    radial-gradient(ellipse at 50% 50%, hsl(25 95% 53% / .14), transparent 60%),\n    var(--bg);\n}\n.close-slide .frame {\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n}\n.close-slide .leaf-big {\n  width: 96px; height: 96px; color: var(--brand);\n  margin-bottom: 56px;\n  filter: drop-shadow(0 0 30px hsl(25 95% 53% / .35));\n}\n.close-slide .tag {\n  font-size: 128px;\n  font-weight: 600;\n  letter-spacing: -0.04em;\n  line-height: 1;\n  color: var(--fg);\n}\n.close-slide .tag em { font-style: italic; color: var(--brand); font-weight: 500; }\n.close-slide .sub-tag {\n  margin-top: 36px;\n  font-family: 'Geist Mono', monospace;\n  font-size: 22px;\n  color: var(--fg-mute);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n}\n.close-slide .agent-row {\n  margin-top: 80px;\n  display: flex; gap: 48px;\n  font-size: 22px;\n  color: var(--fg-mute);\n  font-family: 'Geist Mono', monospace;\n  letter-spacing: 0.06em;\n}\n.close-slide .agent-row .dot {\n  display: inline-block; width: 6px; height: 6px;\n  border-radius: 999px; background: var(--brand);\n  margin-right: 14px; transform: translateY(-3px);\n}\n\n/* ============================================================\n   utility svg sizing\n   ============================================================ */\n.ic { width: 24px; height: 24px; }\n.ic-lg { width: 32px; height: 32px; }\n\n/* hide footer on title + close */\n.no-footer .slide-footer { display: none; }\n<\u002Fstyle>\n<script src=\"d7536139-5ed7-47db-8ac4-b5c6287bef3a\"><\u002Fscript>\n<style>\n  /* slide-specific tweaks for the 8-block script */\n  :root { --pad-bottom: 110px; --pad-y: 72px; }\n  .eyebrow { font-size: 24px; }\n  .slide-footer { font-size: 22px; }\n\n  /* ====== TEAM ====== */\n  .team-grid {\n    display: grid;\n    grid-template-columns: repeat(5, 1fr);\n    gap: 28px;\n    margin-top: 56px;\n    flex: 1;\n    align-items: stretch;\n  }\n  .team-card {\n    background: var(--surface);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 36px 28px;\n    display: flex; flex-direction: column;\n    gap: 14px;\n    position: relative;\n  }\n  .team-card.lead {\n    border-color: var(--brand-line);\n    background: linear-gradient(180deg, hsl(25 95% 53% / .10), hsl(25 95% 53% / .02));\n    box-shadow: var(--brand-glow);\n  }\n  .team-avatar {\n    width: 96px; height: 96px;\n    border-radius: 999px;\n    background: var(--brand-soft);\n    color: var(--brand);\n    display: grid; place-items: center;\n    font-family: 'Geist Mono', monospace;\n    font-size: 30px; font-weight: 600;\n    letter-spacing: -0.02em;\n    border: 1px solid var(--brand-line);\n    overflow: hidden;\n  }\n  .team-avatar img {\n    width: 100%; height: 100%;\n    object-fit: cover;\n    display: block;\n  }\n  .team-card.lead .team-avatar { border-color: var(--brand); box-shadow: 0 0 0 2px hsl(25 95% 53% / .25); }\n  .team-card .role-tag {\n    font-family: 'Geist Mono', monospace;\n    font-size: 16px;\n    color: var(--brand);\n    letter-spacing: 0.10em;\n    text-transform: uppercase;\n    margin-top: 8px;\n  }\n  .team-card h3 {\n    font-size: 26px; font-weight: 600;\n    color: var(--fg);\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n  }\n  .team-card .role {\n    font-size: 20px;\n    color: var(--fg);\n    font-weight: 500;\n    line-height: 1.3;\n  }\n  .team-card p {\n    font-size: 18px;\n    color: var(--fg-mute);\n    line-height: 1.5;\n    margin-top: auto;\n  }\n\n  /* ====== ABOUT ====== */\n  /* about / offer layout */\n  .about-lede {\n    margin-top: 22px;\n    font-size: 22px; line-height: 1.5;\n    color: var(--fg-mute);\n    max-width: 70ch;\n  }\n  .about-lede em { font-style: normal; color: var(--fg); font-weight: 500; }\n\n  .offer-grid {\n    margin-top: 28px;\n    display: grid;\n    grid-template-columns: 1.15fr 1fr;\n    gap: 20px;\n  }\n  .offer-card {\n    background: var(--surface);\n    border: 1px solid var(--line);\n    border-radius: 16px;\n    padding: 24px 28px;\n    display: flex; flex-direction: column;\n    gap: 10px;\n    position: relative;\n  }\n  .offer-card.flagship {\n    border-color: var(--brand-line);\n    background: linear-gradient(180deg, hsl(25 95% 53% / .10), hsl(25 95% 53% / .02));\n    box-shadow: var(--brand-glow);\n  }\n  .offer-card .o-tag {\n    font-family: 'Geist Mono', monospace;\n    font-size: 14px; letter-spacing: 0.18em;\n    color: var(--brand); text-transform: uppercase;\n    display: inline-flex; align-items: center; gap: 10px;\n  }\n  .offer-card .o-tag .dot { width: 8px; height: 8px; background: var(--brand); border-radius: 999px; }\n  .offer-card .product-row {\n    display: flex; align-items: center; gap: 16px;\n    margin-top: 4px;\n  }\n  .offer-card .product-row .leaf-mk {\n    width: 44px; height: 44px;\n    color: var(--brand);\n  }\n  .offer-card h3 {\n    font-size: 38px; font-weight: 600;\n    color: var(--fg);\n    letter-spacing: -0.02em;\n    line-height: 1.1;\n  }\n  .offer-card .o-sub {\n    font-size: 22px;\n    color: var(--fg);\n    line-height: 1.3;\n    font-weight: 500;\n  }\n  .offer-card p {\n    font-size: 17px;\n    color: var(--fg-mute);\n    line-height: 1.45;\n  }\n  .offer-card .o-icon {\n    width: 56px; height: 56px;\n    display: grid; place-items: center;\n    background: var(--brand-soft); color: var(--brand);\n    border-radius: 12px;\n  }\n  .offer-tags {\n    margin-top: 6px;\n    display: flex; flex-wrap: wrap; gap: 8px;\n  }\n  .offer-tags span {\n    font-family: 'Geist Mono', monospace;\n    font-size: 13px; letter-spacing: 0.06em;\n    padding: 5px 12px;\n    border: 1px solid var(--line);\n    border-radius: 999px;\n    color: var(--fg-mute);\n  }\n  .offer-card.flagship .offer-tags span {\n    border-color: var(--brand-line);\n    color: var(--brand);\n    background: hsl(25 95% 53% / .06);\n  }\n\n  /* condensed common-ground row */\n  .common-row {\n    margin-top: 16px;\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 10px;\n  }\n  .common-row li {\n    list-style: none;\n    background: hsl(222 47% 9%);\n    border: 1px solid var(--line-soft);\n    border-radius: 10px;\n    padding: 10px 14px;\n    display: flex; align-items: center; gap: 10px;\n  }\n  .common-row .ci {\n    flex: 0 0 32px; width: 32px; height: 32px;\n    display: grid; place-items: center;\n    background: var(--brand-soft); color: var(--brand);\n    border-radius: 6px;\n  }\n  .common-row .ci svg { width: 16px; height: 16px; }\n  .common-row b { font-size: 16px; font-weight: 500; color: var(--fg); line-height: 1.3; }\n\n  /* ====== DEMO SYSTEM (block 4) — animated graph ====== */\n  .graph-stage {\n    position: relative;\n    flex: 1;\n    margin-top: 24px;\n    margin-bottom: 16px;\n    min-height: 600px;\n  }\n  .graph-svg {\n    position: absolute; inset: 0;\n    width: 100%; height: 100%;\n    pointer-events: none;\n    z-index: 1;\n  }\n  .graph-svg path.conn {\n    fill: none;\n    stroke: hsl(25 95% 53% / .55);\n    stroke-width: 2;\n    stroke-linecap: round;\n    stroke-dasharray: 800;\n    stroke-dashoffset: 800;\n    filter: drop-shadow(0 0 8px hsl(25 95% 53% / .35));\n  }\n  .graph-svg circle.dot {\n    fill: hsl(25 95% 53%);\n    filter: drop-shadow(0 "16\" height=\"16\" rx=\"2\"><\u002Frect><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\"><\u002Frect><line x1=\"9\" y1=\"2\" x2=\"9\" y2=\"4\"><\u002Fline><line x1=\"15\" y1=\"2\" x2=\"15\" y2=\"4\"><\u002Fline><line x1=\"9\" y1=\"20\" x2=\"9\" y2=\"22\"><\u002Fline><line x1=\"15\" y1=\"20\" x2=\"15\" y2=\"22\"><\u002Fline><line x1=\"20\" y1=\"9\" x2=\"22\" y2=\"9\"><\u002Fline><line x1=\"20\" y1=\"15\" x2=\"22\" y2=\"15\"><\u002Fline><line x1=\"2\" y1=\"9\" x2=\"4\" y2=\"9\"><\u002Fline><line x1=\"2\" y1=\"15\" x2=\"4\" y2=\"15\"><\u002Fline><\u002Fsymbol>\n    <symbol id=\"i-eye\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsymbol>\n    <symbol id=\"i-link\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1\"><\u002Fpath><\u002Fsymbol>\n    <symbol id=\"i-globe\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"><\u002Fline><path d=\"M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z\"><\u002Fpath><\u002Fsymbol>\n    <symbol id=\"i-arrow\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsymbol>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Good afternoon. I'm Ricardo Carrillo, from Automation Labs. Over the next six minutes, we're going to show you PlantTalk: an AI assistant built for critical-infrastructure operations. The idea behind the product fits in one sentence — let your infrastructure talk. Instead of jumping between five dashboards and three query languages to figure out what's going on, you ask in plain English, and the assistant answers with real data from the stack you're already running. Today we're showing it specifically on a datacenter.\",\n  \"Before we get into it, the team behind the product. José Cañelón — Technical Chief Manager. Drives the technical direction and product architecture. Victor Kneider — AI Software Developer. Owns the conversational agent and the frontend; in a few minutes Victor will take over and show you the live demo. Luis Galué — AI Backend Specialist. Handles the integration layer with the datasources and the agent's tool orchestration. Ramón Álvarez — AI Software Engineer. Data pipelines, ingestion, and curation of technical documentation. And myself, Ricardo Carrillo — I work on the computer-vision and detection modules. We're a compact, full-stack team focused on AI applied to operations.\",\n  \"Who are we? Automation Labs is a startup building AI tools for industrial and critical-infrastructure operations. Anywhere there are sensors, metrics, events, and technical manuals — that's our space. Our thesis is simple: industrial plants and datacenters have more in common than people think. In both environments you have a heterogeneous monitoring stack, alerts firing without context, scattered documentation, and operators losing critical minutes switching between tools. PlantTalk is our answer to that. And that's why today we're going to test it specifically in your context.\",\n  \"This is the setup we put together for the demonstration. I want you to keep the big picture in mind before we dive into each piece. At the center, PlantTalk — the assistant. It's the only interface the operator touches. It receives the question in natural language and decides who to consult underneath. Around it, four kinds of sources the assistant knows how to use. One — monitoring datasources: the standard observability stack. Two — the applications under monitoring: in this experiment, Nginx as a reverse proxy and Docker containers as the workloads. Three — technical documentation: engineering-rich manuals, loaded and queryable. And four — a custom application of our own: a Kalman-filter-based anomaly detector, plugged into the assistant as just another tool. The promise is: one question, and the assistant coordinates all of that for you.\",\n  \"Let's get specific about the stack. For those of you who don't work with these tools day to day, one line each. Prometheus is the metrics database — CPU, RAM, disk, network. Whatever you'd see graphed in your NMS, that data lives there. Loki is the same, but for logs. The source of truth when a metric tells you something is wrong but doesn't tell you why. cAdvisor measures containers from the inside — resource usage per container, not per host. Grafana is the visualization and alerting layer that ties the previous three together. What are we monitoring on top of that? Two pieces representative of any modern datacenter: Nginx as a reverse proxy — every inbound HTTP request passes through it, which makes its logs the source of truth for latency, errors, and access patterns. And Docker containers as the actual workloads serving applications. Key point: PlantTalk doesn't replace any of this. It reads the APIs of the stack you already have running. Zero new infrastructure.\",\n  \"The third pillar is technical documentation. For this demo we loaded the manual for the BNO080, a 9-DOF orientation sensor from Bosch. Why that document if we're talking about datacenters? Because it has exactly the structure of the documents you handle every day: electrical specifications, characteristics tables, operating ranges, engineering units, pinout diagrams, referenceable sections. So if the assistant can answer 'what's the operating voltage of the BNO080' and cite the exact section of the datasheet — it answers with the same precision 'what's the operating range of the PDUs in rack 12', or 'what does the runbook say about SSH key rotation', as long as the document is loaded. The point isn't the sensor. The point is: engineering in PDF, queryable in natural language, with citations back to the source section.\",\n  \"The fourth pillar is the most interesting piece, because it's ours: a custom application based on Kalman filters for anomaly detection in datacenters. Why Kalman and not a traditional threshold? Because the anomalies that actually matter in a datacenter don't always cross a fixed threshold. A disk starting to fail drifts slowly. A temperature that oscillates more than usual without ever hitting the limit. A sensor that 'freezes' on a plausible value. A traditional alert misses all of that. A Kalman filter doesn't, because it models the expected behavior of the variable and measures the deviation against the model — not against a static number. You'll see it in two modes. Offline, on a historical dataset — to show what kind of anomaly it catches and what the interface looks like. And online, reading in real time from the test datacenter. And at the end, closing the loop: that same app, plugged into PlantTalk as another tool of the agent. The operator doesn't open the app — they ask the assistant, and the assistant consults it when needed.\",\n  \"Quick recap of what's coming: you'll see an assistant that answers about server state, about a stopped container with automatic root cause, about Nginx logs to detect anomalous traffic, about the loaded documentation, and about the anomalies our custom app finds — all from a single conversation. No queries to write. No tabs to switch. No metric names to remember. I'll hand it over to Victor Kneider, who's going to show you all of this running live. Victor —\"\n]\n<\u002Fscript>\n\n<deck-stage width=\"1920\" height=\"1080\" style=\"--deck-rail-w: 188px;\">\n\n  <!-- ============================================================\n       01 · OPENING\n       ============================================================ -->\n  <section data-label=\"01 Opening\" class=\"title-slide no-footer\">\n    <div class=\"frame\">\n      <div class=\"title-mark\">\n        <svg class=\"leaf\"><use href=\"#leaf\"><\u002Fuse><\u002Fsvg>\n        <span class=\"word\">PlantTalk<\u002Fspan>\n      <\u002Fdiv>\n      <h1 class=\"title-hero\" style=\"\">Let your <span style=\"color: rgb(249, 116, 21);\">datacenter<\u002Fspan>&nbsp;<span class=\"accent\"><\u002Fspan>talk.<\u002Fh1>\n      <p class=\"title-sub\">An AI assistant for critical-infrastructure operations. One conversation — instead of five dashboards and three query languages — answered with real data from the stack you already run.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"title-meta\">\n      <span><b>Datacenter Demo<\u002Fb> &nbsp;·&nbsp; Automation Labs<\u002Fspan>\n      <span>Ricardo Carrillo &nbsp;·&nbsp; 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       02 · TEAM\n       ============================================================ -->\n  <section data-label=\"02 Team\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">The team<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:30ch;\">A compact, full-stack team focused on <em>AI for operations.<\u002Fem><\u002Fh1>\n\n      <div class=\"team-grid\">\n        <div class=\"team-card\">\n          <div class=\"team-avatar\"><img src=\"702305c9-af10-4017-b912-a28bd3116c51\" alt=\"José Cañelón\"><\u002Fdiv>\n          <div class=\"role-tag\">Founder · CTO<\u002Fdiv>\n          <h3 style=\"\">Jose Canelon<\u002Fh3>\n          <div class=\"role\">Founder, Chief Technology Officer<\u002Fdiv>\n          <p style=\"\"><span style=\"color: rgb(148, 163, 184);\">Drives the technical direction and product architecture. Vision modules and the Kalman-based anomaly detector.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"team-card lead\">\n          <div class=\"team-avatar\"><img src=\"c479ffaf-d1fc-450e-9037-2f6b63a3a488\" alt=\"Victor Kneider\"><\u002Fdiv>\n          <div class=\"role-tag\">Demo lead<\u002Fdiv>\n          <h3>Victor Kneider<\u002Fh3>\n          <div class=\"role\" style=\"\">AI Front End Engineer, Founding Team<\u002Fdiv>\n          <p>Conversational agent and frontend. Driving today's live demo.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"team-card\">\n          <div class=\"team-avatar\"><img src=\"3f328b08-e1b7-4880-88f1-ed7920bd764b\" alt=\"Luis Galué\"><\u002Fdiv>\n          <div class=\"role-tag\">Backend<\u002Fdiv>\n          <h3>Luis Galué<\u002Fh3>\n          <div class=\"role\" style=\"\">AI Backend Specialist, Founding Team<\u002Fdiv>\n          <p>Integration layer with datasources and the agent's tool orchestration.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"team-card\">\n          <div class=\"team-avatar\">RA<\u002Fdiv>\n          <div class=\"role-tag\">Data &amp; Docs<\u002Fdiv>\n          <h3>Ramón Álvarez<\u002Fh3>\n          <div class=\"role\">AI Software Engineer<\u002Fdiv>\n          <p>Data pipelines, ingestion, and curation of technical documentation.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"team-card\">\n          <div class=\"team-avatar\"><img src=\"8fdea33b-2cc5-4cdf-bc34-1f2df683e868\" alt=\"Ricardo Carrillo\"><\u002Fdiv>\n          <div class=\"role-tag\">Speaker<\u002Fdiv>\n          <h3>Ricardo Carrillo<\u002Fh3>\n          <div class=\"role\">Founder\nAI Engineer<\u002Fdiv>\n          <p style=\"\"><span style=\"color: rgb(148, 163, 184);\">Business Vision and support AI research.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Team<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>01 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       03 · ABOUT AUTOMATION LABS\n       ============================================================ -->\n  <section data-label=\"03 Automation Labs\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">About Automation Labs<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:32ch;\">AI tools for industrial and <em>critical-infrastructure<\u002Fem> operations.<\u002Fh1>\n\n      <p class=\"about-lede\">Wherever there are <em>critical equipments, sensors, metrics, events and technical context<\u002Fem> — that's our space. Industrial plants and datacenters have more in common than people think.<\u002Fp>\n\n      <div class=\"offer-grid\">\n        <div class=\"offer-card flagship\">\n          <span class=\"o-tag\"><span class=\"dot\"><\u002Fspan> Flagship product<\u002Fspan>\n          <div class=\"product-row\">\n            <svg class=\"leaf-mk\"><use href=\"#leaf\"><\u002Fuse><\u002Fsvg>\n            <h3>PlantTalk<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"o-sub\">An assistant for <em style=\"color:var(--brand);font-style:normal\">Critical Systems.<\u002Fem><\u002Fdiv>\n          <p>One conversation across your monitoring stack, your workloads, and your engineering documentation — answered with real data, with citations.<\u002Fp>\n          <div class=\"offer-tags\">\n            <span>datacenters<\u002Fspan>\n            <span>industrial plants<\u002Fspan>\n            <span>energy &amp; utilities<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"offer-card\">\n          <span class=\"o-tag\"><span class=\"dot\"><\u002Fspan> Services<\u002Fspan>\n          <div class=\"product-row\">\n            <div class=\"o-icon\"><svg class=\"ic-lg\"><use href=\"#i-cpu\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <h3 style=\"font-size:34px\">Industrial AI<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"o-sub\">Professional services for AI in operations.<\u002Fdiv>\n          <p>Custom integrations, ingestion of proprietary documentation, fine-tuning to your stack, and on-site deployment for regulated environments.<\u002Fp>\n          <div class=\"offer-tags\">\n            <span>integrations<\u002Fspan>\n            <span>ingestion<\u002Fspan>\n            <span>fine-tuning<\u002Fspan>\n            <span>on-prem<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <ul class=\"common-row\">\n        <li><div class=\"ci\"><svg class=\"ic\"><use href=\"#i-grid\"><\u002Fuse><\u002Fsvg><\u002Fdiv><b>Heterogeneous monitoring stacks<\u002Fb><\u002Fli>\n        <li><div class=\"ci\"><svg class=\"ic\"><use href=\"#i-bell\"><\u002Fuse><\u002Fsvg><\u002Fdiv><b>Alerts without context<\u002Fb><\u002Fli>\n        <li><div class=\"ci\"><svg class=\"ic\"><use href=\"#i-paper\"><\u002Fuse><\u002Fsvg><\u002Fdiv><b>Scattered technical documentation<\u002Fb><\u002Fli>\n        <li><div class=\"ci\"><svg class=\"ic\"><use href=\"#i-eye\"><\u002Fuse><\u002Fsvg><\u002Fdiv><b>Time lost switching tools<\u002Fb><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Automation Labs<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>02 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       04 · DEMO SYSTEM OVERVIEW\n       ============================================================ -->\n  <section data-label=\"04 System overview\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">The system we built for the demo<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:30ch;\">One assistant. <em>Four kinds of sources<\u002Fem> underneath.<\u002Fh1>\n\n      <div class=\"graph-stage\">\n        <!-- connectors: viewBox matches stage proportions (1640 x 600) -->\n        <svg class=\"graph-svg\" viewBox=\"0 0 1640 600\" preserveAspectRatio=\"none\">\n          <!-- top-left → hub -->\n          <path class=\"conn conn-tl\" d=\"M 360 80 C 600 80 700 220 820 280\"><\u002Fpath>\n          <!-- top-right → hub -->\n          <path class=\"conn conn-tr\" d=\"M 1280 80 C 1040 80 940 220 820 280\"><\u002Fpath>\n          <!-- bottom-left → hub -->\n          <path class=\"conn conn-bl\" d=\"M 360 520 C 600 520 700 380 820 320\"><\u002Fpath>\n          <!-- bottom-right → hub -->\n          <path class=\"conn conn-br\" d=\"M 1280 520 C 1040 520 940 380 820 320\"><\u002Fpath>\n\n          <!-- terminus dots at hub end of each line -->\n          <g>\n            <circle class=\"dot dot-tl\" cx=\"820\" cy=\"280\" r=\"5\"><\u002Fcircle>\n            <circle class=\"dot dot-tr\" cx=\"820\" cy=\"280\" r=\"5\"><\u002Fcircle>\n            <circle class=\"dot dot-bl\" cx=\"820\" cy=\"320\" r=\"5\"><\u002Fcircle>\n            <circle class=\"dot dot-br\" cx=\"820\" cy=\"320\" r=\"5\"><\u002Fcircle>\n          <\u002Fg>\n\n          <!-- expanding rings at the source end of each connector -->\n          <circle class=\"pulse ring-tl\" cx=\"360\" cy=\"80\" r=\"6\"><\u002Fcircle>\n          <circle class=\"pulse ring-tr\" cx=\"1280\" cy=\"80\" r=\"6\"><\u002Fcircle>\n          <circle class=\"pulse ring-bl\" cx=\"360\" cy=\"520\" r=\"6\"><\u002Fcircle>\n          <circle class=\"pulse ring-br\" cx=\"1280\" cy=\"520\" r=\"6\"><\u002Fcircle>\n        <\u002Fsvg>\n\n        <div class=\"gnode tl\">\n          <div class=\"num\">01 · Sources<\u002Fdiv>\n          <div class=\"row\">\n            <div class=\"ni\"><svg><use href=\"#i-activity\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <h4>Monitoring datasources<\u002Fh4>\n          <\u002Fdiv>\n          <p>The standard observability stack — metrics, logs, container resources, alerting.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"gnode tr\">\n          <div class=\"num\">03 · Knowledge<\u002Fdiv>\n          <div class=\"row\">\n            <div class=\"ni\"><svg><use href=\"#i-paper\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <h4>Technical documentation<\u002Fh4>\n          <\u002Fdiv>\n          <p>Engineering manuals — loaded, indexed, queryable in plain English with citations.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"gnode bl\">\n          <div class=\"num\">02 · Workloads<\u002Fdiv>\n          <div class=\"row\">\n            <div class=\"ni\"><svg><use href=\"#i-box\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <h4>Apps under monitoring<\u002Fh4>\n          <\u002Fdiv>\n          <p>Nginx as the reverse proxy and Docker containers as the workloads being served.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"gnode br\">\n          <div class=\"num\">04 · Custom app<\u002Fdiv>\n          <div class=\"row\">\n            <div class=\"ni\"><svg><use href=\"#i-sparkles\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <h4>Kalman anomaly detector<\u002Fh4>\n          <\u002Fdiv>\n          <p>Built in-house. Plugged into the assistant as just another tool of the agent.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"ghub\">\n          <span class=\"ring\"><\u002Fspan>\n          <svg class=\"leaf-mark\"><use href=\"#leaf\"><\u002Fuse><\u002Fsvg>\n          <div class=\"tag\">PlantTalk<\u002Fdiv>\n          <h3>The assistant<\u002Fh3>\n          <p>Receives one natural-language question and decides which sources to consult underneath.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>System overview<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>03 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       05 · STACK + APPS\n       ============================================================ -->\n  <section data-label=\"05 Stack and apps\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">The monitoring stack<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:30ch;\">The stack you already run — <em>read by the assistant.<\u002Fem><\u002Fh1>\n\n      <div class=\"stack-grid\">\n        <div class=\"stack-card\">\n          <div class=\"si\"><svg class=\"ic\"><use href=\"#i-activity\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div class=\"stag\">Metrics database<\u002Fdiv>\n          <h4>Prometheus<\u002Fh4>\n          <p>CPU, RAM, disk, network. Whatever you'd see graphed in your NMS lives here.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack-card\">\n          <div class=\"si\"><svg class=\"ic\"><use href=\"#i-paper\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div class=\"stag\">Logs database<\u002Fdiv>\n          <h4>Loki<\u002Fh4>\n          <p>Source of truth when a metric says something is wrong but not why.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack-card\">\n          <div class=\"si\"><svg class=\"ic\"><use href=\"#i-cpu\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div class=\"stag\">Container metrics<\u002Fdiv>\n          <h4>cAdvisor<\u002Fh4>\n          <p>Resource usage measured per container — not per host.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack-card\">\n          <div class=\"si\"><svg class=\"ic\"><use href=\"#i-line\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div class=\"stag\">Visualization · alerting<\u002Fdiv>\n          <h4>Grafana<\u002Fh4>\n          <p>Dashboards and alerting that tie the previous three together.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"apps-row\">\n        <div class=\"app-card\">\n          <div class=\"ai\"><svg class=\"ic-lg\"><use href=\"#i-shield\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"a-tag\">Reverse proxy<\u002Fdiv>\n            <h4>Nginx<\u002Fh4>\n            <p>Every inbound HTTP request passes through it — its logs are the source of truth for latency, errors, and access patterns.<\u002Fp>\n            <span class=\"pill\">access logs · 4xx · 5xx · latency<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"app-card\">\n          <div class=\"ai\"><svg class=\"ic-lg\"><use href=\"#i-box\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"a-tag\">Workloads<\u002Fdiv>\n            <h4>Docker containers<\u002Fh4>\n            <p>The actual services and applications being served — the things operators are paid to keep running.<\u002Fp>\n            <span class=\"pill\">running · stopped · restart · OOM<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"stack-cta\">\n        <svg class=\"ic-lg\" style=\"color:var(--brand)\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg>\n        <span><b>Zero new infrastructure.<\u002Fb> &nbsp;PlantTalk reads the APIs of what you already have running.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Monitoring stack &amp; apps<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>04 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       06 · TECHNICAL DOCUMENTATION\n       ============================================================ -->\n  <section data-label=\"06 Documentation\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">Technical documentation<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:24ch;\">Engineering in PDF, <em>queryable in plain English.<\u002Fem><\u002Fh1>\n\n      <div class=\"docs-grid\">\n        <div class=\"doc-mock\">\n          <div class=\"doc-head\">\n            <div class=\"di\"><svg class=\"ic-lg\"><use href=\"#i-paper\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div class=\"doc-title\">BNO080 · Bosch Sensortec<\u002Fdiv>\n              <div class=\"doc-sub\">9-DOF · System-in-Package · Datasheet v1<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"spec-row\"><span class=\"k\">Operating voltage<\u002Fspan><span class=\"v\">1.65 – 3.6 V<\u002Fspan><\u002Fdiv>\n            <div class=\"spec-row\"><span class=\"k\">Accelerometer range<\u002Fspan><span class=\"v\">±8 g<\u002Fspan><\u002Fdiv>\n            <div class=\"spec-row\"><span class=\"k\">Gyroscope range<\u002Fspan><span class=\"v\">±2000 °/s<\u002Fspan><\u002Fdiv>\n            <div class=\"spec-row\"><span class=\"k\">Package<\u002Fspan><span class=\"v\">28-pin LGA · 5.2 × 3.8 × 1.1 mm<\u002Fspan><\u002Fdiv>\n            <div class=\"spec-row\"><span class=\"k\">Section 4.2<\u002Fspan><span class=\"v\">Pinout · Electrical specs<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"cite-arrow\">cited from § 4.2 — page 14 &nbsp;<svg class=\"ic\" style=\"width:14px;height:14px\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n\n        <div>\n          <p class=\"lede\" style=\"font-size:24px;max-width:38ch;line-height:1.55\">We select BOSCH SENSORTEC specs because have the structure as the documents you handle every day: electrical specs, characteristics tables, operating ranges, engineering units, referenceable sections.<\u002Fp>\n          <ul class=\"docs-points\">\n            <li><b>Operating voltage of the BNO080<\u002Fb> — answered with the exact section cited.<\u002Fli>\n            <li><b>Operating range of the PDUs in rack 12<\u002Fb> — same precision, once the doc is loaded.<\u002Fli>\n            <li><b>Runbook for SSH key rotation<\u002Fb> — natural-language Q&amp;A on your SOPs.<\u002Fli>\n            <li><b>Citations back to the source section<\u002Fb> — never a hallucinated answer.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Documentation<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>05 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       07 · KALMAN ANOMALY DETECTION\n       ============================================================ -->\n  <section data-label=\"07 Kalman anomalies\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">Custom application<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:32ch;\">Anomaly detection with <em>Kalman filters.<\u002Fem><\u002Fh1>\n\n      <div class=\"kalman-grid\">\n        <div>\n          <p class=\"lede\">Why Kalman and not a traditional threshold? The anomalies that actually matter <em>don't always cross a fixed line.<\u002Fem><\u002Fp>\n          <ul class=\"why-list\">\n            <li><span><b>Slow drift<\u002Fb> &nbsp;— a disk starting to fail.<\u002Fspan><\u002Fli>\n            <li><span><b>Anomalous oscillation<\u002Fb> &nbsp;— a temperature that wobbles without hitting the limit.<\u002Fspan><\u002Fli>\n            <li><span><b>Frozen sensor<\u002Fb> &nbsp;— a plausible value that never changes.<\u002Fspan><\u002Fli>\n            <li><span><b>Model-based deviation<\u002Fb> &nbsp;— compared against expected behavior, not a static number.<\u002Fspan><\u002Fli>\n          <\u002Ful>\n          <div class=\"loop-callout\">\n            <div class=\"lci\"><svg class=\"ic\"><use href=\"#i-link\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <span>Closing the loop: this same app is plugged into PlantTalk as <b>another tool of the agent.<\u002Fb><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"kalman-modes\">\n          <div class=\"mode-card\">\n            <span class=\"mode-tag\">Mode 01 · Offline<\u002Fspan>\n            <h4>Historical dataset<\u002Fh4>\n            <p>Shown on a recorded dataset — what kind of anomaly it catches, and what the interface looks like.<\u002Fp>\n            <div class=\"k-chart\">\n              <div class=\"k-head\"><span>variable · historical<\u002Fspan><span><b>3 anomalies caught<\u002Fb><\u002Fspan><\u002Fdiv>\n              <svg viewBox=\"0 0 400 60\" preserveAspectRatio=\"none\">\n                <!-- Kalman expected band -->\n                <path d=\"M0,30 L40,28 L80,32 L120,29 L160,33 L200,28 L240,30 L280,29 L320,31 L360,30 L400,30 L400,40 L360,40 L320,41 L280,39 L240,40 L200,38 L160,43 L120,39 L80,42 L40,38 L0,40 Z\" fill=\"hsl(200 80% 57% / .15)\" stroke=\"none\"><\u002Fpath>\n                <path d=\"M0,35 L40,33 L80,37 L120,34 L160,38 L200,33 L240,35 L280,34 L320,36 L360,35 L400,35\" fill=\"none\" stroke=\"hsl(200 80% 57% / .55)\" stroke-width=\"1\" stroke-dasharray=\"2,2\"><\u002Fpath>\n                <!-- actual signal -->\n                <path d=\"M0,35 L20,34 L40,33 L60,36 L80,37 L100,34 L120,35 L140,8 L160,38 L180,36 L200,33 L220,34 L240,35 L260,36 L280,52 L300,52 L320,53 L340,36 L360,35 L380,35 L400,35\" fill=\"none\" stroke=\"hsl(25 95% 53%)\" stroke-width=\"1.6\"><\u002Fpath>\n                <!-- markers -->\n                <circle cx=\"140\" cy=\"8\" r=\"3\" fill=\"hsl(0 78% 60%)\"><\u002Fcircle>\n                <circle cx=\"300\" cy=\"52\" r=\"3\" fill=\"hsl(0 78% 60%)\"><\u002Fcircle>\n                <circle cx=\"380\" cy=\"35\" r=\"2.5\" fill=\"hsl(38 95% 55%)\"><\u002Fcircle>\n              <\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"mode-card live\">\n            <span class=\"mode-tag\">Mode 02 · Online<\u002Fspan>\n            <h4>Live datacenter feed<\u002Fh4>\n            <p>Reading variables in real time from the test datacenter — same model, applied as data arrives.<\u002Fp>\n            <div class=\"k-chart\">\n              <div class=\"k-head\"><span>variable · streaming<\u002Fspan><span><b>monitoring · 1 deviation<\u002Fb><\u002Fspan><\u002Fdiv>\n              <svg viewBox=\"0 0 400 60\" preserveAspectRatio=\"none\">\n                <path d=\"M0,32 L60,30 L120,34 L180,30 L240,33 L300,30 L360,32 L400,32 L400,42 L360,42 L300,40 L240,43 L180,40 L120,44 L60,40 L0,42 Z\" fill=\"hsl(200 80% 57% / .15)\" stroke=\"none\"><\u002Fpath>\n                <path d=\"M0,37 L60,35 L120,39 L180,35 L240,38 L300,35 L360,37 L400,37\" fill=\"none\" stroke=\"hsl(200 80% 57% / .55)\" stroke-width=\"1\" stroke-dasharray=\"2,2\"><\u002Fpath>\n                <path d=\"M0,37 L40,36 L80,38 L120,38 L160,37 L200,36 L240,38 L280,40 L320,46 L360,52 L400,55\" fill=\"none\" stroke=\"hsl(25 95% 53%)\" stroke-width=\"1.8\"><\u002Fpath>\n                <circle cx=\"400\" cy=\"55\" r=\"3.5\" fill=\"hsl(0 78% 60%)\"><\u002Fcircle>\n                <line x1=\"320\" y1=\"0\" x2=\"320\" y2=\"60\" stroke=\"hsl(25 95% 53%)\" stroke-width=\"1\" stroke-dasharray=\"3,3\" opacity=\".4\"><\u002Fline>\n                <text x=\"324\" y=\"12\" font-family=\"Geist Mono\" font-size=\"8\" fill=\"hsl(25 95% 53%)\">drift starts<\u002Ftext>\n              <\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Custom app · Kalman<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>06 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       08 · CLOSING + HANDOFF\n       ============================================================ -->\n  <section data-label=\"08 Handoff\" data-deck-last-visible=\"\">\n    <div class=\"frame\">\n      <div class=\"eyebrow\">What you're about to see<\u002Fdiv>\n      <h1 class=\"slide-title\" style=\"margin-top:32px;max-width:32ch;\">One conversation. <em>Five answers no dashboard gives you.<\u002Fem><\u002Fh1>\n\n      <div class=\"recap-grid\">\n        <div class=\"recap-card\">\n          <span class=\"num\">01<\u002Fspan>\n          <h5>Server state<\u002Fh5>\n          <p>Live host metrics in one response.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"recap-card\">\n          <span class=\"num\">02<\u002Fspan>\n          <h5>Stopped container<\u002Fh5>\n          <p>Detected automatically — root cause from logs.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"recap-card\">\n          <span class=\"num\">03<\u002Fspan>\n          <h5>Nginx logs<\u002Fh5>\n          <p>Anomalous traffic and attack patterns surfaced.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"recap-card\">\n          <span class=\"num\">04<\u002Fspan>\n          <h5>Documentation<\u002Fh5>\n          <p>Engineering specs, answered with citations.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"recap-card\">\n          <span class=\"num\">05<\u002Fspan>\n          <h5>Kalman anomalies<\u002Fh5>\n          <p>Our custom app, asked through the assistant.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"handoff-band\">\n        <div class=\"av\"><img src=\"c479ffaf-d1fc-450e-9037-2f6b63a3a488\" alt=\"Victor Kneider\" style=\"width:100%;height:100%;object-fit:cover;border-radius:999px;\"><\u002Fdiv>\n        <div>\n          <div class=\"ho-tag\">Handing over to<\u002Fdiv>\n          <h3>Victor Kneider<\u002Fh3>\n          <div class=\"ho-sub\">AI Software Developer — driving the live demo.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"arrow\">— live demo →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slide-footer\">\n      <span>Handoff<\u002Fspan>\n      <span class=\"brand-mark\"><svg><use href=\"#leaf\"><\u002Fuse><\u002Fsvg> PlantTalk<\u002Fspan>\n      <span>07 / 07<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n\n\n<grammarly-desktop-integration data-grammarly-shadow-root=\"true\"><\u002Fgrammarly-desktop-integration><\u002Fbody><\u002Fhtml>"
