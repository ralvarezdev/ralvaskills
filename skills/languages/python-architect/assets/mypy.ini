# python-architect template — mypy strict config.
#
# Drop in your project root as `mypy.ini`, or fold the [mypy] section into
# pyproject.toml under [tool.mypy] (rename `[mypy]` -> `[tool.mypy]`, and each
# `[mypy-pkg.*]` override into a `[[tool.mypy.overrides]]` table with
# `module = "pkg.*"`).
#
# Pinned to mypy 2.1.x — track via STACK.md and bump in lockstep.
# Pairs with ruff (see python-architect §10) — mypy owns the type system,
# ruff handles style and bug-class rules.

[mypy]
python_version = 3.14
strict = true
warn_unused_configs = true

# Beyond the --strict baseline
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

# Output
pretty = true
show_error_codes = true
show_column_numbers = true

mypy_path = src
packages = your_package
namespace_packages = false
explicit_package_bases = true

exclude = (?x)(
    ^\.venv/
    | ^build/
    | ^dist/
    | ^migrations/versions/
  )

# Tests: fixtures and @pytest.mark.parametrize routinely defeat full
# inference — relax the untyped-def checks rather than fighting the framework.
[mypy-tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# Alembic migration scripts are generated, not hand-typed.
[mypy-migrations.*]
ignore_errors = true

# Third-party packages without bundled types or stubs on PyPI. Add entries
# here per-dependency instead of a blanket ignore_missing_imports = true,
# which would silently swallow first-party import typos too.
[mypy-some_untyped_dependency.*]
ignore_missing_imports = true
