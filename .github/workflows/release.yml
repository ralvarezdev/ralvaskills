name: Release CLI

on:
  push:
    tags:
      # Only bare semver tags (the rsk CLI). Skill tags like
      # `work-report-generator@v1.1.0` start with letters and are ignored.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history to build the changelog
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser to the exact triggering tag so it can't grab a
          # skill tag (e.g. `name@vX.Y.Z`) via `git describe` fallback.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
