# ralvaskills default bundle catalog
# This file is embedded in the rsk binary. To customise bundles or add your
# own, create ~/.config/rsk/catalog.toml — bundles with the same name replace
# the defaults; new names are appended.

[[bundle]]
name        = "global"
description = "Universal skills — install machine-wide; apply to every project"
skills = [
  { name = "commit-author",                 source = "local" },
  { name = "logic-cleaner",                 source = "local" },
  { name = "code-design-refactor",          source = "local" },
  { name = "tdd",                           source = "local" },
  { name = "grill-with-docs",               source = "local" },
  { name = "caveman",                       source = "local" },
  { name = "feature-planner",               source = "local" },
  { name = "security-reviewer",             source = "local" },
  { name = "ddd-architect",                 source = "local" },
  { name = "hexagonal-arch",                source = "local" },
  { name = "design-patterns",               source = "local" },
  { name = "improve-codebase-architecture", source = "local" },
  { name = "rsk-guide",                     source = "local" },
  { name = "repo-tooling-architect",        source = "local" },
  { name = "skill-builder",                 source = "local" },
]

