version: 2

project_name: rsk

before:
  hooks:
    - go mod tidy

builds:
  - id: rsk
    main: ./cmd/rsk
    binary: rsk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ralvarezdev/ralvaskills/cmd/rsk.version={{ .Version }}
      - -X github.com/ralvarezdev/ralvaskills/cmd/rsk.commit={{ .ShortCommit }}
      - -X github.com/ralvarezdev/ralvaskills/cmd/rsk.buildDate={{ .Date }}

archives:
  - id: rsk
    name_template: "rsk-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "rsk-{{ .Version }}-checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore(registry):" # skip automated index commits
      - "^chore: trigger"   # skip manual CI triggers
