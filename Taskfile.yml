version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # CLI (rsk)

  cli:build:
    desc: Build the rsk CLI binary to bin/rsk
    sources:
      - "cmd/rsk/**/*.go"
      - "internal/**/*.go"
      - go.mod
    generates:
      - bin/rsk
    cmds:
      - go build -o bin/rsk ./cmd/rsk

  cli:run:
    desc: "Run the rsk CLI — pass args after --  (e.g. task cli:run -- init)"
    cmds:
      - go run ./cmd/rsk {{.CLI_ARGS}}

  cli:tag:
    desc: "Tag and push a CLI release — triggers the Release CLI workflow (e.g. task cli:tag VERSION=0.1.0)"
    requires:
      vars: [VERSION]
    vars:
      TAG: v{{.VERSION}}
    cmds:
      - platforms: [windows]
        cmd: pwsh -NoProfile -Command "if ('{{.VERSION}}' -notmatch '^\d+\.\d+\.\d+$') { Write-Error 'Invalid version {{.VERSION}} — expected X.Y.Z'; exit 1 }"
      - platforms: [linux, darwin]
        cmd: echo '{{.VERSION}}' | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid version {{.VERSION}} — expected X.Y.Z"; exit 1; }
      - git tag {{.TAG}}
      - git push origin {{.TAG}}

  cli:lint:
    desc: Lint the rsk CLI
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/rsk/... ./internal/...

  cli:fmt:
    desc: Format the rsk CLI (goimports + golines)
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/rsk/... ./internal/...

  # cmd/count-tokens

  tokens:
    desc: Re-generate docs/TOKEN_COUNTS.md with latest SKILL.md byte/token estimates
    sources:
      - skills/**/SKILL.md
      - cmd/count-tokens/**/*.go
    generates:
      - docs/TOKEN_COUNTS.md
    cmds:
      - go run ./cmd/count-tokens

  tokens:lint:
    desc: Lint the count-tokens tool
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/count-tokens/...

  tokens:fmt:
    desc: Format the count-tokens tool (goimports + golines)
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/count-tokens/...

  # cmd/generate-registry

  registry:generate:
    desc: "Build registry tarballs and updated index.json into dist/ (merges against registry/index.json)"
    sources:
      - skills/**/*.md
      - cmd/generate-registry/**/*.go
    generates:
      - dist/index.json
      - dist/new-versions.json
    cmds:
      - mkdir -p dist registry
      - go run ./cmd/generate-registry --skills-dir skills --output-dir dist --existing-index registry/index.json {{.CLI_ARGS}}

  registry:check:
    desc: "Preview what would be published; validate version format and show current → new for each skill"
    cmds:
      - mkdir -p registry
      - go run ./cmd/generate-registry --skills-dir skills --existing-index registry/index.json --check

  registry:sync-index:
    desc: "Copy dist/index.json → registry/index.json (run after registry:generate; commit the result to bootstrap or repair the index)"
    cmds:
      - task: registry:generate
      - platforms: [windows]
        cmd: pwsh -NoProfile -Command "Copy-Item dist/index.json registry/index.json -Force"
      - platforms: [linux, darwin]
        cmd: cp dist/index.json registry/index.json
      - echo ""
      - echo "registry/index.json updated. Commit it:"
      - echo "  git add registry/index.json"

  registry:lint:
    desc: Lint the generate-registry tool
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/generate-registry/...

  registry:fmt:
    desc: Format the generate-registry tool
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/generate-registry/...

  registry:clean:
    desc: Remove the dist/ output directory
    cmds:
      - platforms: [windows]
        cmd: pwsh -NoProfile -Command "Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue"
      - platforms: [linux, darwin]
        cmd: rm -rf dist

  # aggregate

  lint:
    desc: Lint everything
    cmds:
      - golangci-lint run --config .golangci.yml ./...

  lint:doccheck:
    desc: "Check exported doc-comment coverage (revive exported & package-comments rules)"
    cmds:
      - golangci-lint run --config .golangci.doccheck.yml ./cmd/rsk/... ./internal/... ./cmd/count-tokens/... ./cmd/generate-registry/...

  lint:oneliners:
    desc: Check for one-line function bodies (not part of the standard gate — opt-in)
    cmds:
      - bash skills/languages/go-architect/assets/check-no-oneline-functions.sh

  lint:separators:
    desc: Check for decorative comment separators (// ──, # ──, etc. — opt-in)
    cmds:
      - bash skills/languages/go-architect/assets/check-no-separator-comments.sh

  fmt:
    desc: Format everything
    cmds:
      - golangci-lint fmt --config .golangci.yml ./...

  build:
    desc: Build all binaries
    deps:
      - cli:build

  deps:
    desc: Update Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  test:
    desc: Run all tests
    cmds:
      - go test ./...
