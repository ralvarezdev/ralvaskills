version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # CLI (rsk)

  cli:build:
    desc: Build the rsk CLI binary to bin/rsk
    sources:
      - "cmd/rsk/**/*.go"
      - "internal/**/*.go"
      - go.mod
    generates:
      - bin/rsk
    cmds:
      - go build -o bin/rsk ./cmd/rsk

  cli:run:
    desc: "Run the rsk CLI — pass args after --  (e.g. task cli:run -- init)"
    cmds:
      - go run ./cmd/rsk {{.CLI_ARGS}}

  cli:lint:
    desc: Lint the rsk CLI
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/rsk/... ./internal/...

  cli:fmt:
    desc: Format the rsk CLI (goimports + golines)
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/rsk/... ./internal/...

  # cmd/count-tokens

  tokens:
    desc: Re-generate docs/TOKEN_COUNTS.md with latest SKILL.md byte/token estimates
    sources:
      - skills/**/SKILL.md
      - cmd/count-tokens/**/*.go
    generates:
      - docs/TOKEN_COUNTS.md
    cmds:
      - go run ./cmd/count-tokens

  tokens:lint:
    desc: Lint the count-tokens tool
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/count-tokens/...

  tokens:fmt:
    desc: Format the count-tokens tool (goimports + golines)
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/count-tokens/...

  # cmd/generate-registry

  registry:generate:
    desc: "Build registry tarballs and updated index.json into dist/ (merges against registry/index.json)"
    sources:
      - skills/**/*.md
      - cmd/generate-registry/**/*.go
    generates:
      - dist/index.json
      - dist/new-versions.json
    cmds:
      - mkdir -p dist registry
      - go run ./cmd/generate-registry --skills-dir skills --output-dir dist --existing-index registry/index.json {{.CLI_ARGS}}

  registry:check:
    desc: "Preview what would be published; validate version format and show current → new for each skill"
    cmds:
      - task: registry:generate
      - |
        count=$(jq 'length' dist/new-versions.json)
        if [ "$count" -eq 0 ]; then
          echo "Nothing to publish — all skill versions are already in the index."
          exit 0
        fi
        echo ""
        echo "$count skill(s) ready to publish:"
        echo ""
        jq -r '.[] | "\(.name) \(.version)"' dist/new-versions.json | while IFS=' ' read -r name ver; do
          latest=$(jq -r --arg n "$name" '.skills[$n].latest // "(new)"' dist/index.json)
          echo "  $name  $latest → v$ver"
        done
        echo ""
        bad=$(jq -r '.[] | select(.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not) | "  \(.name): \"\(.version)\" is not X.Y.Z"' dist/new-versions.json)
        if [ -n "$bad" ]; then
          echo "Invalid version format (expected X.Y.Z):"
          echo "$bad"
          exit 1
        fi
        echo "All version formats OK."

  registry:sync-index:
    desc: "Copy dist/index.json → registry/index.json (run after registry:generate; commit the result to bootstrap or repair the index)"
    cmds:
      - task: registry:generate
      - cp dist/index.json registry/index.json
      - |
        echo ""
        echo "registry/index.json updated. Commit it:"
        echo "  git add registry/index.json"
        echo "  git commit -m 'chore(registry): sync index'"

  registry:lint:
    desc: Lint the generate-registry tool
    cmds:
      - golangci-lint run --config .golangci.yml ./cmd/generate-registry/...

  registry:fmt:
    desc: Format the generate-registry tool
    cmds:
      - golangci-lint fmt --config .golangci.yml ./cmd/generate-registry/...

  registry:clean:
    desc: Remove the dist/ output directory
    cmds:
      - rm -rf dist

  # aggregate

  lint:
    desc: Lint everything
    cmds:
      - golangci-lint run --config .golangci.yml ./...

  fmt:
    desc: Format everything
    cmds:
      - golangci-lint fmt --config .golangci.yml ./...

  build:
    desc: Build all binaries
    deps:
      - cli:build

  deps:
    desc: Update Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  test:
    desc: Run all tests
    cmds:
      - go test ./...
