version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # ── CLI (rsk) ──────────────────────────────────────────────────────────────

  cli:build:
    desc: Build the rsk CLI binary to bin/rsk
    dir: cli
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - ../bin/rsk
    cmds:
      - go build -o ../bin/rsk .

  cli:run:
    desc: "Run the rsk CLI — pass args after --  (e.g. task cli:run -- init)"
    dir: cli
    cmds:
      - go run . {{.CLI_ARGS}}

  cli:lint:
    desc: Lint the rsk CLI module
    dir: cli
    cmds:
      - golangci-lint run --config ../.golangci.yml ./...

  cli:fmt:
    desc: Format the rsk CLI module (goimports + golines)
    dir: cli
    cmds:
      - golangci-lint fmt --config ../.golangci.yml ./...

  # ── scripts/count-tokens ──────────────────────────────────────────────────

  tokens:
    desc: Re-generate docs/TOKEN_COUNTS.md with latest SKILL.md byte/token estimates
    sources:
      - skills/**/SKILL.md
      - scripts/count-tokens/**/*.go
    generates:
      - docs/TOKEN_COUNTS.md
    cmds:
      - go run ./scripts/count-tokens

  tokens:lint:
    desc: Lint the count-tokens script
    dir: scripts/count-tokens
    cmds:
      - golangci-lint run --config ../../.golangci.yml ./...

  tokens:fmt:
    desc: Format the count-tokens script (goimports + golines)
    dir: scripts/count-tokens
    cmds:
      - golangci-lint fmt --config ../../.golangci.yml ./...

  # ── scripts/generate-registry ─────────────────────────────────────────────

  registry:generate:
    desc: "Build registry tarballs and updated index.json into dist/ (merges against registry/index.json)"
    sources:
      - skills/**/*.md
      - scripts/generate-registry/**/*.go
    generates:
      - dist/index.json
      - dist/new-versions.json
    cmds:
      - mkdir -p dist
      - go run ./scripts/generate-registry --skills-dir skills --output-dir dist --existing-index registry/index.json {{.CLI_ARGS}}

  registry:lint:
    desc: Lint the generate-registry script
    dir: scripts/generate-registry
    cmds:
      - golangci-lint run --config ../../.golangci.yml ./...

  registry:fmt:
    desc: Format the generate-registry script
    dir: scripts/generate-registry
    cmds:
      - golangci-lint fmt --config ../../.golangci.yml ./...

  registry:clean:
    desc: Remove the dist/ output directory
    cmds:
      - rm -rf dist

  # ── dependencies ────────────────────────────────────────────────────────────

  cli:deps:
    desc: Update Go dependencies in the rsk CLI module
    dir: cli
    cmds:
      - go get -u ./...
      - go mod tidy

  tokens:deps:
    desc: Update Go dependencies in the count-tokens script
    dir: scripts/count-tokens
    cmds:
      - go get -u ./...
      - go mod tidy

  registry:deps:
    desc: Update Go dependencies in the generate-registry script
    dir: scripts/generate-registry
    cmds:
      - go get -u ./...
      - go mod tidy

  # ── aggregate ─────────────────────────────────────────────────────────────

  lint:
    desc: Lint all Go modules
    deps:
      - cli:lint
      - tokens:lint
      - registry:lint

  fmt:
    desc: Format all Go modules
    deps:
      - cli:fmt
      - tokens:fmt
      - registry:fmt

  build:
    desc: Build all Go binaries
    deps:
      - cli:build

  deps:
    desc: Update Go dependencies in all modules
    deps:
      - cli:deps
      - tokens:deps
      - registry:deps
